{# The season picker. Rendered inside the shell on first paint, and swapped back
   out-of-band by /load so a league switch relists THAT league's seasons. #}
<select name="season" id="season" {% if oob %}hx-swap-oob="true"{% endif %}>
  {% for s in seasons %}
  <option value="{{ s }}" {% if s == season %}selected{% endif %}>{{ s }}</option>
  {% endfor %}
</select>
