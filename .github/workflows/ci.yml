name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install deps
        run: pip install -r python/requirements.txt

      - name: pytest (network-free)
        working-directory: python
        env:
          SLEEPERMETRICS_NO_IMAGES: "1"
        run: python -m pytest -q

  deploy-health:
    # Informational only: Render auto-deploys from main regardless of this job.
    # A red X here means the new revision booted but /health did not answer.
    if: github.ref == 'refs/heads/main'
    needs: python
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Render to redeploy, then check /health
        run: |
          sleep 120
          for i in $(seq 1 10); do
            if curl -fsS https://ddbm-fantasy-football.onrender.com/health; then
              echo "healthy"; exit 0
            fi
            echo "retry $i"; sleep 20
          done
          echo "::error::/health did not come back after the deploy"; exit 1
